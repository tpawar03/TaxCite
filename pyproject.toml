[project]
name = "taxcite"
version = "0.1.0"
description = "Citation-grounded RAG for compound federal tax questions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "qdrant-client",
    "psycopg[binary]",
    "redis",
    "fastembed>=0.8.0",
    "httpx",
    "pdfminer-six>=20260107",
    "anthropic>=1.7.0",
    "openai>=3.16.2",
    "python-dotenv>=1.2.3",
]

[project.scripts]
taxcite = "taxcite.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

name: injection

# G4 (ADR-14): the prompt-path injection corpus, eval/dev-injection.jsonl, must pass every row. One hostile document
# that changes an answer fails the PR. It needs the live models, so it runs only where an answer can change: ingestion,
# prompts, retrieval, verification and the job pipeline. ~$0.14 a run (2026-11-02), both providers.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/taxcite/ingest/**"
      - "src/taxcite/generate.py"
      - "src/taxcite/verify.py"
      - "src/taxcite/retrieve.py"
      - "src/taxcite/decompose.py"
      - "src/taxcite/jobs.py"
      - "src/taxcite/api.py"
      - "eval/g4_injection.py"
      - "eval/dev-injection.jsonl"

jobs:
  injection:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports: ["6333:6333"]
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: taxcite, POSTGRES_PASSWORD: taxcite, POSTGRES_DB: taxcite }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taxcite" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      QDRANT_URL: http://localhost:6333
      DATABASE_URL: postgresql://taxcite:taxcite@localhost:5432/taxcite
      OPENAI_API_KEY: "${{ secrets.OPENAI_API_KEY }}"
      ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --frozen
      - run: for i in $(seq 1 30); do curl -sf localhost:6333/readyz && exit 0; sleep 2; done; exit 1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-bge-base-jina-turbo-v1
      - name: restore the corpus
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release download --pattern '*' --dir dist "$(gh release list --limit 1 --json tagName --jq '.[0].tagName')"
          uv run python eval/snapshot.py restore --from dist

      # `shell: bash` runs with pipefail, so the runner's exit status survives the tee (the faithfulness gate's lesson)
      - name: every injection row passes
        shell: bash
        run: uv run python eval/g4_injection.py | tee injection.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: injection
          path: |
            injection.log
            eval/results/g4-injection-*.jsonl

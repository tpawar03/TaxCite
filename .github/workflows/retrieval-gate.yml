name: retrieval gate

on:
  pull_request:
    paths:
      - "src/taxcite/retrieve.py"
      - "src/taxcite/decompose.py"
      - "src/taxcite/index.py"
      - "src/taxcite/chunk.py"
      - "src/taxcite/ingest/**"
      - "eval/retrieval.py"
      - "eval/dev.jsonl"

jobs:
  retrieval:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports: ["6333:6333"]
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: taxcite, POSTGRES_PASSWORD: taxcite, POSTGRES_DB: taxcite }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taxcite" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      QDRANT_URL: http://localhost:6333
      DATABASE_URL: postgresql://taxcite:taxcite@localhost:5432/taxcite
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --frozen
      - run: for i in $(seq 1 30); do curl -sf localhost:6333/readyz && exit 0; sleep 2; done; exit 1

      - name: cache the embedding and cross-encoder models
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-bge-base-jina-turbo-v1

      - name: restore the corpus
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release download --pattern '*' --dir dist "$(gh release list --limit 1 --json tagName --jq '.[0].tagName')"
          uv run python eval/snapshot.py restore --from dist

      # No LLM: plans come from the committed cache, so this comparison is deterministic and
      # any drop is a real regression, not the planner having a different day (log #46).
      # Threshold is the measured dev figure less a small margin for Qdrant version drift.
      - name: retrieval must not regress
        run: |
          uv run python eval/retrieval.py \
            --pilot eval/dev.jsonl --mode hybrid --k 10 \
            --decompose route --plan-cache eval/results/decompositions.json \
            --fail-under 0.66

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: retrieval-results, path: eval/results/retrieval-*.json }
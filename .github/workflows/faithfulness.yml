name: faithfulness

# Weekly, not per-PR and not nightly, and every part of that is measured (ADR-22).
#
# Not per-PR: on the 25 rows affordable there, a broken prompt separates from a healthy one by
# 2.2 sigma -- about 12% false failures. The golden set is where this metric can resolve.
#
# Weekly with 5 repeats rather than nightly with 3: frequency and repeats buy different things.
# Frequency buys detection latency, which is nearly worthless here because synthesis-prompt
# changes are rare and deliberate -- you dispatch this by hand on the branch where you made one.
# Repeats buy statistical power directly, since the gate compares a mean and the standard error
# falls as 1/sqrt(n). Nightly at 3 repeats costs $48.60/month (the project's entire ceiling is
# $50) for 6.4% false passes; weekly at 5 costs $11.65 for 2.5%. Cheaper and better, because
# the original spent on the axis that does not matter.
on:
  schedule: [{ cron: "0 6 * * 1" }]  # Mondays
  workflow_dispatch:
  release: { types: [published] }

jobs:
  faithfulness:
    # A corpus snapshot is published as a release too, and publishing one should not spend
    # 50 minutes and $1.40 re-judging the golden set. Found the hard way: uploading
    # corpus-2026-09-23 fired this job (run 35898818357).
    if: >-
      github.event_name != 'release' ||
      !startsWith(github.event.release.tag_name, 'corpus-')
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports: ["6333:6333"]
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: taxcite, POSTGRES_PASSWORD: taxcite, POSTGRES_DB: taxcite }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taxcite" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      QDRANT_URL: http://localhost:6333
      DATABASE_URL: postgresql://taxcite:taxcite@localhost:5432/taxcite
      OPENAI_API_KEY: "${{ secrets.OPENAI_API_KEY }}"
      ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --frozen
      - run: for i in $(seq 1 30); do curl -sf localhost:6333/readyz && exit 0; sleep 2; done; exit 1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-bge-base-jina-turbo-v1
      - name: restore the corpus
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release download --pattern '*' --dir dist "$(gh release list --limit 1 --json tagName --jq '.[0].tagName')"
          uv run python eval/snapshot.py restore --from dist

      # Threshold 0.855, set from BOTH measured bands on the runner (ADR-22):
      #   healthy main                    0.870 / 0.884 / 0.889  mean 0.881 sd 0.010
      #   grounding rule removed          0.849 / 0.841 / 0.842  mean 0.844 sd 0.004
      # The bands do not overlap -- healthy's worst run beats broken's best by 0.021 -- and
      # 0.855 sits inside that window with ~2.5 sd of margin on each side.
      #
      # The first attempt used 0.83, three sigma below a healthy mean measured locally. That
      # was below where a broken build actually lands, so the proof run passed when it should
      # have gone red (runs 35901633914 and 35901637011). Calibrating against the healthy
      # distribution alone is not enough: the threshold has to sit between two measured bands,
      # and the golden gap (0.037) is smaller than the dev gap (0.05) that it was extrapolated
      # from. Re-measure both bands after any pipeline change, not just the healthy one.
      # `shell: bash` is load-bearing: it runs with `-eo pipefail`, whereas the default
      # `bash -e` takes a pipeline's exit status from its LAST command. Without it the `| tee`
      # swallows a non-zero exit and this gate can never go red -- which is what it did through
      # the entire first proof run. The retrieval gate has no pipe, which is why that one
      # failed honestly.
      - name: faithfulness
        shell: bash
        run: |
          uv run python eval/ragas_eval.py --repeats 5 --max-cost 5.00 \
            --fail-under 0.855 | tee faithfulness.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faithfulness
          path: |
            faithfulness.log
            eval/results/ragas-*.json
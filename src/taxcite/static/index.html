<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaxCite</title>
  <style>
    :root { --ink: #1d1d1f; --muted: #6b6b70; --line: #d9d9de; --bg: #fafafa; --card: #fff; --accent: #2f5d8a; --bad: #a33; }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #ececef; --muted: #a0a0a8; --line: #3a3a40; --bg: #18181b; --card: #222226; --accent: #8ab4dd; --bad: #e88; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 system-ui, sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    h2 { font-size: 1.05rem; margin: 24px 0 8px; }
    section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-top: 16px; }
    label { display: block; font-size: .9rem; color: var(--muted); margin-bottom: 4px; }
    input, textarea, button { font: inherit; color: inherit; }
    input[type=password], textarea { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: transparent; }
    textarea { min-height: 96px; resize: vertical; }
    button { margin-top: 8px; padding: 6px 14px; border: 1px solid var(--accent); border-radius: 6px; background: transparent; color: var(--accent); cursor: pointer; }
    ol, ul { padding-left: 20px; }
    .muted, small { color: var(--muted); }
    .error { color: var(--bad); }
    .badge, .treatment { display: inline-block; margin-left: 8px; padding: 0 8px; border-radius: 999px; font-size: .8rem; border: 1px solid var(--line); }
    .treatment { border-color: var(--bad); color: var(--bad); }
    .citation { font-family: ui-monospace, monospace; font-size: .9rem; }
    #answer p { margin: 0 0 8px; overflow-wrap: anywhere; }
  </style>
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <h1>TaxCite</h1>
    <p class="muted">Federal tax research with every sentence cited and checked against its source.</p>

    <section>
      <label for="key">API key</label>
      <input id="key" type="password" autocomplete="off">
    </section>

    <section>
      <form id="ask">
        <label for="question">Question</label>
        <textarea id="question" required></textarea>
        <button type="submit">Ask</button>
      </form>
      <ol id="stages" class="muted"></ol>
      <div id="answer"></div>
    </section>

    <section>
      <h2>Client documents</h2>
      <form id="upload">
        <label for="file">PDF, PNG, JPEG or TIFF, up to 10 MB</label>
        <input id="file" type="file" accept=".pdf,.png,.jpg,.jpeg,.tif,.tiff">
        <button type="submit">Upload</button>
        <button type="button" id="refresh">Refresh</button>
      </form>
      <p id="upload-status" class="muted"></p>
      <ul id="documents"></ul>
    </section>
  </main>
</body>
</html>

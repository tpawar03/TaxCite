services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports: ["6333:6333"]
    volumes: [qdrant:/qdrant/storage]

  postgres:
    # postgres 16 plus the pgvector extension, for the ADR-17 benchmark (T6b)
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: taxcite
      POSTGRES_PASSWORD: taxcite
      POSTGRES_DB: taxcite
    # 5433 on the host: something else already owns 5432
    ports: ["5433:5432"]
    volumes: [postgres:/var/lib/postgresql/data]

  redis:
    image: redis:7
    # 6380 on the host: a local redis-server already owns 6379
    ports: ["6380:6379"]

volumes:
  qdrant:
  postgres:
